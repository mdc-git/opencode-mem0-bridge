name: Maintenance repair

on:
  push:
    branches:
      - maintenance/ci-repair-2026-10-09
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/ci-repair-2026-10-09
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install current dependency graph
        run: bun install

      - name: Apply repository-supported fixes
        id: fix
        shell: bash
        run: |
          set +e
          bun run fix
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit generated repairs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair dependency graph and repository checks" -m "Apply the repository-supported fix pipeline to refresh compatible dependencies, regenerate the Bun lockfile, remediate audit findings where supported, and normalize formatting/lint output. Keep all existing validation gates enabled and validate the branch before integration."
          git push origin HEAD:maintenance/ci-repair-2026-10-09

      - name: Report fix status
        run: |
          echo "Initial fix exit status: ${{ steps.fix.outputs.status }}"
