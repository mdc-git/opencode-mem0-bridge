name: Repair Dependabot PR

on:
  push:
    branches:
      - dependabot/bun/eslint-config-xo-5.0.0

permissions:
  contents: write

concurrency:
  group: repair-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/bun/eslint-config-xo-5.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Regenerate dependencies
        run: bun install
      - name: Apply repository fixes
        run: |
          bun run fix || true
          bun run prettier . --write --config tooling/prettier.json --ignore-path tooling/prettierignore
          bun install
      - name: Persist repaired PR tree
        run: |
          rm -f .github/workflows/repair-pr.yml
          if git diff --quiet; then
            echo "No repair changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(ci): complete validated dependency upgrade

          Regenerate the Bun lockfile for the XO upgrade, apply repository formatter
          and lint fixes, and resolve audited transitive vulnerabilities while keeping
          all existing validation gates enabled."
          git push origin HEAD:dependabot/bun/eslint-config-xo-5.0.0
      - name: Validate repaired tree
        run: bun run check
