name: Repair Dependabot PR

on:
  push:
    branches:
      - dependabot/bun/eslint-config-xo-5.0.0

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/bun/eslint-config-xo-5.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply repository fixes
        run: bun run fix || true
      - name: Persist repaired PR tree
        run: |
          rm -f .github/workflows/repair-pr.yml
          if git diff --quiet; then
            echo "No repair changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(ci): satisfy updated repository validation

          Apply the repository-maintained fix pipeline after the dependency update.
          Keep the upgraded lint configuration enabled, update generated files as needed,
          and preserve all existing test and security gates."
          git push origin HEAD:dependabot/bun/eslint-config-xo-5.0.0
      - name: Validate repaired tree
        run: bun run check
